<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ .Site.Title }}</title>
  <meta name="description" content="{{ .Site.Params.description }}" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-logo">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" rx="8" fill="#1a7a3c"/>
        <path d="M8 10h6v16H8zM15 18h6v8h-6zM22 13h6v13h-6z" fill="white" opacity="0.9"/>
      </svg>
      <div class="header-title-group">
        <span class="header-title">Карта ПО</span>
        <span class="header-subtitle">Свердловская область</span>
      </div>
    </div>
    <div class="header-meta">
      <span class="total-badge" id="total-count">821 продукт</span>
      <span class="header-desc">Реестр программного обеспечения производителей региона</span>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-inner">
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="6.5" cy="6.5" r="5" stroke="#6b7280" stroke-width="1.5"/>
        <path d="M10.5 10.5L14 14" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input type="text" id="search-input" placeholder="Поиск по названию или правообладателю..." class="search-input" />
      <button class="search-clear" id="search-clear" title="Очистить">✕</button>
    </div>
    <div class="category-tabs" id="category-tabs">
      <button class="tab-btn active" data-cat="all">Все</button>
    </div>
    <div class="results-count" id="results-count"></div>
  </div>
</div>

<main class="map-container" id="map-container">
  <div class="map-grid" id="map-grid">
    <!-- populated by JS -->
  </div>
</main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close">✕</button>
    <div class="modal-header">
      <div class="modal-category-badge" id="modal-cat"></div>
      <div class="modal-subcategory" id="modal-subcat"></div>
    </div>
    <h2 class="modal-title" id="modal-title"></h2>
    <div class="modal-owner" id="modal-owner"></div>
    <div class="modal-inn" id="modal-inn"></div>
    <a class="modal-link" id="modal-link" href="#" target="_blank" rel="noopener noreferrer">
      Открыть в реестре Минцифры
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="margin-left:6px">
        <path d="M2 7h10M7 2l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>
</div>

<footer class="site-footer">
  <div class="footer-inner">
    <span>Реестр программного обеспечения компаний-производителей ПО Свердловской области</span>
    <span class="footer-source">Источник: Реестр отечественного ПО Минцифры России</span>
  </div>
</footer>

<script src="./js/data.js"></script>
<script src="./js/map.js"></script>
</body>
</html>
